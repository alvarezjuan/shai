[package]
name = "shai"
version = "0.1.0"
edition = "2021"

[dependencies]
rig = { version = "0.46", features = ["agent", "reqwest", "derive"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"
toml = "0.8"
regex = "1"
rustyline = "12"
walkdir = "2"
ignore = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "brotli", "rustls-tls"] }
lazy_static = "1.4"
diff = "0.1"
urlencoding = "2"
chrono = "0.4"
scraper = "0.20"
url = "2"
once_cell = "1"
# git2 = { version = "0.18", features = ["vendored-openssl"] }  # TODO: needs openssl/perl setup

[dev-dependencies]
tempfile = "3"